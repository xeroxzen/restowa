name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach, e.g. v0.1.3
        required: true

permissions:
  contents: write

jobs:
  macos-universal:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - name: Build universal binary
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p restowa-cli --target "$target"
          done
          mkdir dist
          lipo -create -output dist/restowa \
            target/aarch64-apple-darwin/release/restowa \
            target/x86_64-apple-darwin/release/restowa
          codesign --force --sign - dist/restowa
          for arch in arm64 x86_64; do lipo dist/restowa -verify_arch "$arch"; done
          test "$(dist/restowa --version)" = "restowa ${TAG#v}"
          cp LICENSE README.md dist/
          name="restowa-${TAG}-macos-universal.tar.gz"
          tar -czf "$name" -C dist restowa LICENSE README.md
          shasum -a 256 "$name" > "$name.sha256"
          cat "$name.sha256"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" restowa-*-macos-universal.tar.gz* --clobber
